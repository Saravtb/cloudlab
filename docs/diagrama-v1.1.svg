<svg width="680" height="490" viewBox="0 0 680 490" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arquitetura implantada da versao v1.1 - Projeto 1 AWS CloudLab</title>
<desc>A equipe publica a imagem no Amazon ECR. A tarefa do ECS com Fargate roda dentro de um security group que libera apenas a porta 8000, recebe requisicoes do cliente, envia logs ao CloudWatch e grava eventos no Amazon RDS PostgreSQL, que fica em outro security group liberando a porta 5432 somente para a aplicacao. As credenciais vem do Secrets Manager e a LabRole autoriza o pull da imagem e a leitura do segredo.</desc>
<style>
  .t  { font: 400 14px system-ui, sans-serif; fill: #2C2C2A; }
  .ts { font: 400 12px system-ui, sans-serif; fill: #5F5E5A; }
  .th { font: 500 14px system-ui, sans-serif; fill: #2C2C2A; }
  .arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
  .leader { stroke: #9c9a92; stroke-width: 0.5; stroke-dasharray: 4 3; fill: none; }
  .gray  { fill: #F1EFE8; stroke: #5F5E5A; }
  .purp  { fill: #EEEDFE; stroke: #534AB7; }
  .teal  { fill: #E1F5EE; stroke: #0F6E56; }
  .p-t { fill: #3C3489; } .p-s { fill: #534AB7; }
  .t-t { fill: #085041; } .t-s { fill: #0F6E56; }
  .g-t { fill: #444441; } .g-s { fill: #5F5E5A; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="180" y="60" width="460" height="410" rx="20" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="6 4"/>
<text class="ts" x="196" y="84">AWS Cloud · conta do Learner Lab · us-east-1</text>

<rect class="gray" x="40" y="100" width="115" height="52" rx="8" stroke-width="0.5"/>
<text class="th g-t" x="97" y="125" text-anchor="middle">Equipe</text>
<text class="ts g-s" x="97" y="142" text-anchor="middle">código + Dockerfile</text>

<rect class="gray" x="40" y="236" width="115" height="52" rx="8" stroke-width="0.5"/>
<text class="th g-t" x="97" y="261" text-anchor="middle">Cliente</text>
<text class="ts g-s" x="97" y="278" text-anchor="middle">navegador · curl</text>

<rect class="purp" x="215" y="100" width="170" height="52" rx="8" stroke-width="0.5"/>
<text class="th p-t" x="300" y="125" text-anchor="middle">Amazon ECR</text>
<text class="ts p-s" x="300" y="142" text-anchor="middle">imagem + digest</text>

<rect class="teal" x="482" y="100" width="152" height="52" rx="8" stroke-width="0.5"/>
<text class="th t-t" x="558" y="125" text-anchor="middle">Secrets Manager</text>
<text class="ts t-s" x="558" y="142" text-anchor="middle">senha do banco</text>

<rect class="teal" x="215" y="180" width="245" height="112" rx="12" stroke-width="0.5"/>
<text class="th t-t" x="233" y="208">Security group · TCP 8000</text>
<text class="ts t-s" x="233" y="226">VPC padrão · subnet pública</text>

<rect class="purp" x="233" y="236" width="205" height="48" rx="8" stroke-width="0.5"/>
<text class="th p-t" x="335" y="259" text-anchor="middle">Amazon ECS + Fargate</text>
<text class="ts p-s" x="335" y="275" text-anchor="middle">API + frontend</text>

<rect class="teal" x="482" y="236" width="152" height="52" rx="8" stroke-width="0.5"/>
<text class="th t-t" x="558" y="261" text-anchor="middle">CloudWatch Logs</text>
<text class="ts t-s" x="558" y="278" text-anchor="middle">driver awslogs</text>

<rect class="teal" x="215" y="320" width="245" height="112" rx="12" stroke-width="0.5"/>
<text class="th t-t" x="233" y="348">Security group do banco</text>
<text class="ts t-s" x="233" y="366">5432 apenas da aplicação</text>

<rect class="purp" x="233" y="376" width="205" height="48" rx="8" stroke-width="0.5"/>
<text class="th p-t" x="335" y="399" text-anchor="middle">Amazon RDS</text>
<text class="ts p-s" x="335" y="415" text-anchor="middle">PostgreSQL · sem IP público</text>

<rect class="gray" x="482" y="376" width="152" height="52" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th g-t" x="558" y="401" text-anchor="middle">IAM · LabRole</text>
<text class="ts g-s" x="558" y="418" text-anchor="middle">pull e segredo</text>

